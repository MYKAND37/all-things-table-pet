name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # The key is fixed, so every build carries the same signature and Android will
      # install it straight over the previous one.
      - name: Unpack the release signing key
        env:
          KEYSTORE_B64: ${{ secrets.ATP_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sign"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sign/release.p12"
          test -s "$RUNNER_TEMP/sign/release.p12"

      - name: Build release APK
        env:
          ATP_KEYSTORE: ${{ runner.temp }}/sign/release.p12
          ATP_KEYSTORE_PASSWORD: ${{ secrets.ATP_KEYSTORE_PASSWORD }}
          ATP_KEY_ALIAS: atp-release
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk all-things-table-pet.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: all-things-table-pet-apk
          path: all-things-table-pet.apk
          if-no-files-found: error
