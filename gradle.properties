# Project-wide Gradle settings.

android.useAndroidX=true
android.nonTransitiveRClass=true

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official

# The name a release goes out under. The version CODE is the CI run number (see
# app/build.gradle.kts) because Android needs it to go up on every build; this is the name
# a person reads, and it changes only when there is something to say.
appVersion=1.11.16
